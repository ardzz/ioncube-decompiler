[project]
name = "ioncube-re"
version = "1.0.0"
description = "Offline ionCube decompiler: decrypt, stream, wire, lift — pure Python"
readme = "README.md"
requires-python = ">=3.12"
# Declared but unused by the shipped code: the runtime is stdlib-only.
dependencies = ["z3-solver", "capstone"]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
ioncube-re = "ioncube_re.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ioncube_re"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: full-corpus sweep tests (minutes)"]
